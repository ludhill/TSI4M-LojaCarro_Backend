#spring.application.name=Ldenner
spring.application.name=LojaCarro
# URL do Banco de Dados
#spring.datasource.url=jdbc:mysql://localhost:3306/lojacarros
spring.datasource.url=jdbc:mysql://localhost:3306/ldenner?createDatabaseIfNotExist=true
spring.datasource.username=root
#spring.datasource.password=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.rate-limit.capacity=1000
app.rate-limit.duration-minutes=1
