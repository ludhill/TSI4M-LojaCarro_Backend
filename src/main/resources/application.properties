# ===================================================================
# CONFIGURAÇÃO GERAL DO MICROSSERVIÇO DE USUÁRIOS
# ===================================================================
spring.application.name=ms-usuarios
server.port=8081

# Alterna dinamicamente entre perfis (dev, prod). Padrão 'dev'.
spring.profiles.active=${SERVER:dev}


# ===================================================================
# CONFIGURAÇÕES DE TAXA DE REQUISIÇÕES (RATE LIMITING - BUCKET4J)
# ===================================================================
app.rate-limit.capacity=1000
app.rate-limit.duration-minutes=1


# ===================================================================
# CONEXÃO COM O BANCO DE DADOS (ISOLADO PARA USUÁRIOS)
# ===================================================================
# Aponta para a base 'db_usuarios' na porta 8081
spring.datasource.url=jdbc:mysql://localhost:3306/db_usuarios?createDatabaseIfNotExist=truespring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ===================================================================
# CONFIGURAÇÕES DO HIBERNATE / JPA
# ===================================================================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# ===================================================================
# CONFIGURAÇÕES DE LOGS E AUDITORIA (LOGBACK + MDC)
# ===================================================================
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [User: %X{usuario:-SISTEMA}] [IP: %X{ip:-LOCAL}] - %msg%n

# Arquivo de log específico do ms-usuarios
logging.file.name=logs/ms-usuarios-audit.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%-5level] [User: %X{usuario:-SISTEMA}] [IP: %X{ip:-LOCAL}] %msg%n