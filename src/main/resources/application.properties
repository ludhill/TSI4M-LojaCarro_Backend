spring.application.name=LojaCarros

# O Spring busca a variável DB_URL; se não achar, usa a URL do localhost
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/carros?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}

# O Spring busca DB_USER e DB_PASS; se não achar, usa 'Ldenner' e '12345'
spring.datasource.username=${DB_USER:Ldenner}
spring.datasource.password=${DB_PASS:12345}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Em produção a AWS enviará 'validate', localmente usa 'update'
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
